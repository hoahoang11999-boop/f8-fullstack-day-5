<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <h1>Register</h1>

        <form autocomplete="off" spellcheck="false">
            <h2>Personal Information</h2>

            <div class="form-group">
                <label for="display-name">Display Name</label>
                <input type="text" id="display-name" name="display_name">
            </div>

            <div class="form-group">
                <p>Gender</p>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </div>

            <div class="form-group">
                <label for="birthday">Date of Birth</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <h2>Contact Information</h2>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
            </div>

            <h2>Account Information</h2>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                >
            </div>

            <h2>Profile Picture (Avatar)</h2>

            <div class="avatar">
                <input type="file" id="avatar" name="avatar" accept="image/*">
                <label for="avatar">Choose Image</label>
            </div>

            <h2>Communication Preferences</h2>

            <div class="option">
                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter"
                    value="yes"
                >
                <label for="newsletter">Subscribe to Newsletter</label>
            </div>

            <div class="option">
                <input
                    type="checkbox"
                    id="promotion"
                    name="promotion"
                    value="yes"
                >
                <label for="promotion">Receive Promotional Emails</label>
            </div>

            <div class="option">
                <input
                    type="checkbox"
                    id="updates"
                    name="updates"
                    value="yes"
                >
                <label for="updates">Get Product Updates</label>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
